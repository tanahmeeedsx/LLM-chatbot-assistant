<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Kleos logo</title>
  <desc id="desc">An abstract infinity pipeline mark representing connected AI and DevOps workflows.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="216" height="216" rx="48" fill="#0B1020" stroke="#273554" stroke-width="2"/>
  <path d="M49 121 C49 80 96 76 120 120 C144 164 191 160 191 119 C191 78 145 77 120 120 C95 163 49 162 49 121 Z"
        fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="49" cy="121" r="7" fill="#38BDF8"/>
  <circle cx="191" cy="119" r="7" fill="#C084FC"/>
</svg>